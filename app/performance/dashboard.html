<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>性能面板</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      --bg: #08111f;
      --panel: #101d31;
      --panel-2: #0c1728;
      --line: #263750;
      --text: #edf4ff;
      --muted: #8ea0bb;
      --blue: #55a7ff;
      --cyan: #50dec6;
      --yellow: #f4c95d;
      --red: #ff7c8d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0, #12315a 0, transparent 32%),
        var(--bg);
      color: var(--text);
    }
    button, select, input { font: inherit; }
    .shell { width: min(1220px, 94vw); margin: 0 auto; padding: 28px 0 50px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }
    h1 { margin: 0 0 6px; font-size: clamp(25px, 4vw, 38px); }
    .subtitle, .status { color: var(--muted); }
    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button, select {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 12px;
      background: var(--panel);
      color: var(--text);
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--blue); }
    label { color: var(--muted); font-size: 14px; }
    input { accent-color: var(--blue); }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .card, .chart-panel, .table-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      box-shadow: 0 14px 40px rgb(0 0 0 / 18%);
    }
    .card { min-height: 110px; padding: 17px; }
    .card-label { color: var(--muted); font-size: 13px; }
    .card-value { margin-top: 12px; font-size: 27px; font-weight: 720; }
    .card-note { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .main-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .chart-panel { padding: 18px; min-height: 310px; }
    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 650;
    }
    .legend { display: flex; gap: 13px; color: var(--muted); font-size: 12px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    canvas { display: block; width: 100%; height: 245px; }
    .breakdown {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 105px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgb(4 12 24 / 35%);
    }
    .metric-box strong { margin-top: 9px; font-size: 22px; }
    .table-panel { overflow: hidden; }
    .table-title { padding: 17px 18px 5px; font-weight: 650; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 850px; }
    th, td {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      text-align: right;
      font-size: 13px;
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 550; background: rgb(2 9 20 / 25%); }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    .tag {
      display: inline-block;
      border-radius: 99px;
      padding: 3px 8px;
      background: rgb(80 222 198 / 13%);
      color: var(--cyan);
    }
    .tag.warn { background: rgb(255 124 141 / 13%); color: var(--red); }
    .empty { padding: 42px; color: var(--muted); text-align: center; }
    .error { color: var(--red); }
    @media (max-width: 900px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .main-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      header { align-items: flex-start; flex-direction: column; }
      .cards { grid-template-columns: 1fr; }
      .shell { width: 92vw; padding-top: 20px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>性能面板</h1>
        <div class="subtitle">只看关键指标，不翻运行日志</div>
      </div>
      <div class="actions">
        <label>最近
          <select id="limit">
            <option value="50">50 次</option>
            <option value="200" selected>200 次</option>
            <option value="1000">1000 次</option>
          </select>
        </label>
        <label><input id="autoRefresh" type="checkbox" checked> 每 5 秒刷新</label>
        <button id="refresh" type="button">立即刷新</button>
      </div>
    </header>

    <section class="cards">
      <div class="card"><div class="card-label">请求数</div><div class="card-value" id="requestCount">—</div><div class="card-note">当前查询范围</div></div>
      <div class="card"><div class="card-label">平均总耗时</div><div class="card-value" id="avgTotal">—</div><div class="card-note" id="p95Total">P95 —</div></div>
      <div class="card"><div class="card-label">平均模型耗时</div><div class="card-value" id="avgLlm">—</div><div class="card-note" id="llmShare">占总耗时 —</div></div>
      <div class="card"><div class="card-label">平均输入 Token</div><div class="card-value" id="avgTokens">—</div><div class="card-note">实际发送载荷估算</div></div>
    </section>

    <section class="main-grid">
      <div class="chart-panel">
        <div class="panel-title">
          <span>最近请求耗时</span>
          <div class="legend">
            <span><i class="dot" style="background:var(--blue)"></i>总耗时</span>
            <span><i class="dot" style="background:var(--cyan)"></i>模型</span>
            <span><i class="dot" style="background:var(--yellow)"></i>上下文</span>
          </div>
        </div>
        <canvas id="latencyChart"></canvas>
      </div>
      <div class="chart-panel">
        <div class="panel-title"><span>压缩与质量</span></div>
        <div class="breakdown">
          <div class="metric-box"><span class="card-label">平均上下文耗时</span><strong id="avgContext">—</strong></div>
          <div class="metric-box"><span class="card-label">触发压缩</span><strong id="compressionRate">—</strong></div>
          <div class="metric-box"><span class="card-label">质量降级</span><strong id="degradedRate">—</strong></div>
          <div class="metric-box"><span class="card-label">平均压缩轮数</span><strong id="avgPasses">—</strong></div>
        </div>
      </div>
    </section>

    <section class="table-panel">
      <div class="table-title">最近记录</div>
      <div class="table-wrap" id="tableWrap"></div>
    </section>
    <p class="status" id="status">正在加载…</p>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    let records = [];
    let refreshTimer = null;

    const number = (value) => Number(value) || 0;
    const average = (values) => values.length
      ? values.reduce((sum, value) => sum + number(value), 0) / values.length
      : 0;
    const milliseconds = (value) => `${number(value).toFixed(0)} ms`;
    const percent = (value) => `${(number(value) * 100).toFixed(1)}%`;
    const shortId = (value) => value && value.length > 15
      ? `${value.slice(0, 8)}…${value.slice(-4)}`
      : value;
    const percentile = (values, ratio) => {
      if (!values.length) return 0;
      const sorted = [...values].map(number).sort((a, b) => a - b);
      return sorted[Math.ceil(sorted.length * ratio) - 1];
    };

    async function loadData() {
      const status = $("#status");
      status.textContent = "正在刷新…";
      status.className = "status";
      try {
        const response = await fetch(`/performance/data?limit=${$("#limit").value}`);
        if (!response.ok) throw new Error(`读取失败：HTTP ${response.status}`);
        const payload = await response.json();
        records = payload.records || [];
        render();
        status.textContent = `最后刷新：${new Date().toLocaleTimeString("zh-CN")}`;
      } catch (error) {
        status.textContent = error.message;
        status.className = "status error";
      }
    }

    function render() {
      const totals = records.map((row) => number(row.total_ms));
      const llms = records.map((row) => number(row.llm_ms));
      const contexts = records.map((row) => number(row.context_ms));
      const count = records.length;
      const avgTotal = average(totals);
      const avgLlm = average(llms);

      $("#requestCount").textContent = count.toLocaleString("zh-CN");
      $("#avgTotal").textContent = milliseconds(avgTotal);
      $("#p95Total").textContent = `P95 ${milliseconds(percentile(totals, 0.95))}`;
      $("#avgLlm").textContent = milliseconds(avgLlm);
      $("#llmShare").textContent = `占总耗时 ${percent(avgTotal ? avgLlm / avgTotal : 0)}`;
      $("#avgTokens").textContent = Math.round(average(records.map((row) => row.input_tokens))).toLocaleString("zh-CN");
      $("#avgContext").textContent = milliseconds(average(contexts));
      $("#compressionRate").textContent = percent(count ? records.filter((row) => number(row.compression_passes) > 0).length / count : 0);
      $("#degradedRate").textContent = percent(count ? records.filter((row) => row.quality_degraded).length / count : 0);
      $("#avgPasses").textContent = average(records.map((row) => row.compression_passes)).toFixed(2);

      renderTable();
      drawChart();
    }

    function renderTable() {
      const wrap = $("#tableWrap");
      if (!records.length) {
        wrap.innerHTML = '<div class="empty">暂无数据。完成一次对话后，这里就会出现性能记录。</div>';
        return;
      }
      const rows = [...records].reverse().slice(0, 100).map((row) => `
        <tr>
          <td>${new Date(row.timestamp).toLocaleString("zh-CN")}</td>
          <td title="${row.conversation_id}">${shortId(row.conversation_id)}</td>
          <td>${milliseconds(row.total_ms)}</td>
          <td>${milliseconds(row.context_ms)}</td>
          <td>${milliseconds(row.llm_ms)}</td>
          <td>${number(row.input_tokens).toLocaleString("zh-CN")}</td>
          <td>${number(row.compression_passes)}</td>
          <td><span class="tag ${row.quality_degraded ? "warn" : ""}">${row.quality_degraded ? "已降级" : "正常"}</span></td>
        </tr>
      `).join("");
      wrap.innerHTML = `
        <table>
          <thead><tr><th>时间</th><th>会话</th><th>总耗时</th><th>上下文</th><th>模型</th><th>Token</th><th>压缩轮数</th><th>质量</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function drawChart() {
      const canvas = $("#latencyChart");
      const ratio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      const context = canvas.getContext("2d");
      context.scale(ratio, ratio);
      context.clearRect(0, 0, width, height);

      const rows = records.slice(-30);
      if (!rows.length) {
        context.fillStyle = "#8ea0bb";
        context.font = "14px system-ui";
        context.textAlign = "center";
        context.fillText("暂无可绘制数据", width / 2, height / 2);
        return;
      }

      const padding = { top: 12, right: 12, bottom: 24, left: 48 };
      const plotWidth = width - padding.left - padding.right;
      const plotHeight = height - padding.top - padding.bottom;
      const maximum = Math.max(...rows.map((row) => number(row.total_ms)), 1);

      context.strokeStyle = "#263750";
      context.fillStyle = "#8ea0bb";
      context.font = "11px system-ui";
      context.textAlign = "right";
      for (let index = 0; index <= 4; index += 1) {
        const y = padding.top + (plotHeight * index / 4);
        const label = maximum * (1 - index / 4);
        context.beginPath();
        context.moveTo(padding.left, y);
        context.lineTo(width - padding.right, y);
        context.stroke();
        context.fillText(`${label.toFixed(0)}ms`, padding.left - 6, y + 4);
      }

      const series = [
        ["total_ms", "#55a7ff"],
        ["llm_ms", "#50dec6"],
        ["context_ms", "#f4c95d"],
      ];
      for (const [field, color] of series) {
        context.strokeStyle = color;
        context.lineWidth = field === "total_ms" ? 2.5 : 1.8;
        context.beginPath();
        rows.forEach((row, index) => {
          const x = padding.left + (rows.length === 1 ? plotWidth / 2 : plotWidth * index / (rows.length - 1));
          const y = padding.top + plotHeight * (1 - number(row[field]) / maximum);
          if (index === 0) context.moveTo(x, y);
          else context.lineTo(x, y);
        });
        context.stroke();
      }
    }

    function configureTimer() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = $("#autoRefresh").checked
        ? setInterval(loadData, 5000)
        : null;
    }

    $("#refresh").addEventListener("click", loadData);
    $("#limit").addEventListener("change", loadData);
    $("#autoRefresh").addEventListener("change", configureTimer);
    window.addEventListener("resize", drawChart);
    configureTimer();
    loadData();
  </script>
</body>
</html>
